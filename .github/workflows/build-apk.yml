# GitHub Actions workflow to build Android Debug APK
name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build & Package Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Android Project Structure
        id: detect_project
        run: |
          echo "== Scanning repository for Android project =="
          ANDROID_DIR=""
          if [ -f "./gradlew" ]; then
            ANDROID_DIR="."
          elif [ -f "./android/gradlew" ]; then
            ANDROID_DIR="./android"
          elif [ -f "./android-app/gradlew" ]; then
            ANDROID_DIR="./android-app"
          else
            GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              ANDROID_DIR=$(dirname "$GRADLEW_PATH")
            fi
          fi

          if [ -z "$ANDROID_DIR" ] || [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "::error::Could not find Android project with Gradle wrapper (gradlew)!"
            exit 1
          fi

          # Detect application module
          APP_MODULE=""
          if [ -d "$ANDROID_DIR/app" ] && [ -f "$ANDROID_DIR/app/build.gradle" ]; then
            APP_MODULE="app"
          elif [ -f "$ANDROID_DIR/build.gradle" ] && grep -q "com.android.application" "$ANDROID_DIR/build.gradle"; then
            APP_MODULE="root"
          else
            APP_DIR=$(find "$ANDROID_DIR" -maxdepth 2 -name "build.gradle" -exec grep -l "com.android.application" {} + | head -n 1)
            if [ -n "$APP_DIR" ]; then
              APP_MODULE=$(basename $(dirname "$APP_DIR"))
            fi
          fi

          if [ -z "$APP_MODULE" ]; then
            echo "::error::Could not find Android application module!"
            exit 1
          fi

          echo "Found Android root: $ANDROID_DIR"
          echo "Found Application module: $APP_MODULE"
          echo "ANDROID_ROOT=$ANDROID_DIR" >> $GITHUB_ENV
          echo "APP_MODULE=$APP_MODULE" >> $GITHUB_ENV

      - name: Set up Node.js (Web Distribution)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Sync Web Assets
        if: hashFiles('package.json') != ''
        run: |
          echo "== Compiling web game distribution =="
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi
          npm run build --if-present
          if command -v npx &> /dev/null && ([ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]); then
            echo "Syncing web assets to native Android project..."
            npx cap sync android || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x "${ANDROID_ROOT}/gradlew"

      - name: Clean Stale Build and Gradle Caches
        run: |
          echo "Purging stale .gradle and build directories..."
          rm -rf "${ANDROID_ROOT}/.gradle"
          if [ -d "${ANDROID_ROOT}/${APP_MODULE}/build" ]; then
            rm -rf "${ANDROID_ROOT}/${APP_MODULE}/build"
          fi
          if [ -d "${ANDROID_ROOT}/build" ]; then
            rm -rf "${ANDROID_ROOT}/build"
          fi
          echo "Clean complete."

      - name: Build Debug APK with Gradle Wrapper
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          echo "Executing Gradle debug APK build..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: locate_apk
        run: |
          echo "Searching for generated APK files..."
          APK_PATHS=$(find "${ANDROID_ROOT}" -type f -name "*.apk" | grep -iE "debug|app" || true)
          if [ -z "$APK_PATHS" ]; then
            APK_PATHS=$(find . -type f -name "*.apk" || true)
          fi

          if [ -z "$APK_PATHS" ]; then
            echo "::error::Gradle build finished but no APK file was produced!"
            exit 1
          fi

          echo "Located APK file(s):"
          echo "$APK_PATHS"

          PRIMARY_APK=""
          for apk in $APK_PATHS; do
            if [ -s "$apk" ]; then
              SIZE=$(du -h "$apk" | cut -f1)
              echo "✓ Verified valid APK: $apk ($SIZE)"
              if [ -z "$PRIMARY_APK" ]; then
                PRIMARY_APK="$apk"
              fi
            else
              echo "::error::APK file $apk is 0 bytes or corrupted!"
              exit 1
            fi
          done

          mkdir -p build-artifacts
          cp "$PRIMARY_APK" build-artifacts/
          echo "apk_path=$PRIMARY_APK" >> $GITHUB_OUTPUT
          echo "Staged $(ls build-artifacts/) for download."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
