<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="70%" stop-color="#0d0a17"/>
      <stop offset="100%" stop-color="#06050a"/>
    </radialGradient>
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Disc -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#342e50" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Runic Embellishments -->
  <path d="M256,40 L268,60 L244,60 Z M256,472 L268,452 L244,452 Z M40,256 L60,268 L60,244 Z M472,256 L452,268 L452,244 Z" fill="#22d3ee" opacity="0.7"/>

  <!-- Shield Shape -->
  <path d="M256,90 C340,90 380,120 380,240 C380,360 256,420 256,420 C256,420 132,360 132,240 C132,120 172,90 256,90 Z" fill="#120f1f" stroke="#ff7043" stroke-width="6" filter="url(#glowFilter)"/>

  <!-- Glowing Greatsword Centerpiece -->
  <g filter="url(#glowFilter)">
    <!-- Blade -->
    <path d="M256,110 L266,320 L256,345 L246,320 Z" fill="url(#swordBlade)"/>
    <line x1="256" y1="110" x2="256" y2="335" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    
    <!-- Crossguard -->
    <path d="M210,320 L302,320 L292,332 L220,332 Z" fill="#ff7043" stroke="#ffe082" stroke-width="2"/>
    <circle cx="256" cy="326" r="6" fill="#22d3ee"/>

    <!-- Hilt & Pommel -->
    <rect x="252" y="332" width="8" height="36" rx="2" fill="#d4af37"/>
    <circle cx="256" cy="376" r="8" fill="#ff7043" stroke="#ffe082" stroke-width="2"/>
    
    <!-- Runic Wings -->
    <path d="M190,200 Q220,180 240,210 Q215,230 190,200 Z" fill="#22d3ee" opacity="0.8"/>
    <path d="M322,200 Q292,180 272,210 Q297,230 322,200 Z" fill="#22d3ee" opacity="0.8"/>
  </g>
</svg>
